name: Build mt7981

on:
  workflow_dispatch:
    inputs:
      REPO:
        description: 'Source repository'
        default: Yuzhii0718
        options:
          - hanwckf
          - Yuzhii0718
        type: choice
      Cache:
        description: 'Using cache to speed up OpenWrt compilation.'
        default: false
        type: boolean
      MEMORY_SHRINK_AGGRESS:
        description: 'CONFIG_MTK_MEMORY_SHRINK_AGGRESS (For 256M device)'
        default: true
        type: boolean
      ZRAM_SWAP:
        description: 'Enable zram-swap (CONFIG_PACKAGE_zram-swap)'
        default: false
        type: boolean
      IPTV_PACKAGES:
        description: 'Include IPTV packages (luci-app-msd_lite & luci-app-omcproxy)'
        default: false
        type: boolean
      MTKHQOS:
        description: 'Enable MTK HQoS (luci-app-eqos-mtk & mtkhqos_util)'
        default: false
        type: boolean

env:
  REPO_URL1: https://github.com/hanwckf/immortalwrt-mt798x
  REPO_URL2: https://github.com/Yuzhii0718/immortalwrt-mt798x-hanwckf
  REPO_BRANCH: openwrt-21.02
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
  
    steps:
    - name: Check Server Performance
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号(降序): 7763，8370C，8272CL，8171M，E5-2673\n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量: $(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo "CPU核心数量: $(nproc)"
        echo -e "CPU型号信息:$(cat /proc/cpuinfo | grep -m1 name | awk -F: '{print $2}')\n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息:"
        echo -e "$(sudo lshw -short -C memory | grep GiB)\n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量: $(ls /dev/sd* 2>/dev/null | grep -v [1-9] | wc -l)" && df -hT

    - name: Checkout
      uses: actions/checkout@v7

    - name: Initialization environment
      timeout-minutes: 30
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash "$GITHUB_WORKSPACE/scripts/init.sh"
        sudo -E apt -yqq install dos2unix
        sudo -E apt -yqq install libfuse-dev
        sudo -E apt -yqq autoremove --purge
        sudo -E apt -yqq autoclean
        sudo -E apt -yqq clean
        sudo -E systemctl daemon-reload
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown "$USER:$(id -g)" /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        if [ "${{ github.event.inputs.REPO }}" = "hanwckf" ]; then
          REPO_URL="$REPO_URL1"
          CONFIG_FILE="configs/mt7981-hanwckf.config"
        else
          REPO_URL="$REPO_URL2"
          CONFIG_FILE="configs/mt7981-Yuzhii0718.config"
        fi
        echo "REPO_URL=$REPO_URL" >> "$GITHUB_ENV"
        echo "CONFIG_FILE=$CONFIG_FILE" >> "$GITHUB_ENV"
        git clone -b $REPO_BRANCH --depth=1 $REPO_URL ImmortalWrt
        ln -sf /workdir/ImmortalWrt $GITHUB_WORKSPACE/ImmortalWrt

    - name: Apply patches
      run: |
        set -euo pipefail
        REPO="${{ github.event.inputs.REPO }}"
        PATCH_DIR="$GITHUB_WORKSPACE/patch/$REPO"

        shopt -s nullglob
        PATCHES=("$PATCH_DIR"/*.patch)
        if [ ! -d "$PATCH_DIR" ] || [ ${#PATCHES[@]} -eq 0 ]; then
          echo "No patch directory or no .patch files for source repository '$REPO' ($PATCH_DIR), skipping."
          exit 0
        fi

        echo "Applying ${#PATCHES[@]} patch(es) from $PATCH_DIR to ImmortalWrt"
        cd ImmortalWrt

        # Apply in filename order (001-..., 002-..., ...)
        while IFS= read -r p; do
          echo "Applying patch: $(basename "$p")"
          patch -p1 --batch --forward < "$p"
        done < <(printf '%s\n' "${PATCHES[@]}" | LC_ALL=C sort)

        echo "All patches from $PATCH_DIR applied successfully."

    - name: Cache Toolchain
      uses: HiGarfield/cachewrtbuild@main
      if: github.event.inputs.Cache == 'true'
      with:
        ccache: 'false'
        clean: 'false'
        mixkey: 'aarch64'
        prefix: ${{ github.workspace }}/ImmortalWrt

    - name: Load custom feeds (DIY_P1_SH)
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF ImmortalWrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd ImmortalWrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd ImmortalWrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd ImmortalWrt && ./scripts/feeds install -a

    - name: Load custom configuration (DIY_P2_SH)
      run: |
        [ -e files ] && mv files ImmortalWrt/files
        chmod +x $DIY_P2_SH
        cd ImmortalWrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Configure firmware options
      run: |
        set -e
        [ -f "$CONFIG_FILE" ] || { echo "Configuration file $CONFIG_FILE not found"; exit 1; }

        # Remove stale entries for every option governed below, then append fresh ones
        for cfg in \
          CONFIG_PACKAGE_kmod-tun \
          CONFIG_PACKAGE_kmod-warp \
          CONFIG_MTK_MEMORY_SHRINK_AGGRESS \
          CONFIG_PACKAGE_kmod-zram \
          CONFIG_PACKAGE_zram-swap \
          CONFIG_PACKAGE_luci-app-msd_lite \
          CONFIG_PACKAGE_luci-app-omcproxy \
          CONFIG_PACKAGE_mtkhqos_util \
          CONFIG_PACKAGE_luci-app-eqos-mtk; do
          sed -i "/$cfg/d" "$CONFIG_FILE"
        done

        # Make sure appends start on a new line even if the file has no trailing newline
        if [ -n "$(tail -c 1 "$CONFIG_FILE")" ]; then
          echo >> "$CONFIG_FILE"
        fi

        # CONFIG_MTK_MEMORY_SHRINK_AGGRESS
        if [ "${{ github.event.inputs.MEMORY_SHRINK_AGGRESS }}" = "true" ]; then
          echo "CONFIG_MTK_MEMORY_SHRINK_AGGRESS=y" >> "$CONFIG_FILE"
        else
          echo "# CONFIG_MTK_MEMORY_SHRINK_AGGRESS is not set" >> "$CONFIG_FILE"
        fi

        # zram-swap (kmod-zram is pulled in automatically as its dependency)
        if [ "${{ github.event.inputs.ZRAM_SWAP }}" = "true" ]; then
          echo "CONFIG_PACKAGE_zram-swap=y" >> "$CONFIG_FILE"
        else
          echo "# CONFIG_PACKAGE_zram-swap is not set" >> "$CONFIG_FILE"
        fi

        # IPTV (luci-app-msd_lite + luci-app-omcproxy)
        if [ "${{ github.event.inputs.IPTV_PACKAGES }}" = "true" ]; then
          echo "CONFIG_PACKAGE_luci-app-msd_lite=y" >> "$CONFIG_FILE"
          echo "CONFIG_PACKAGE_luci-app-omcproxy=y" >> "$CONFIG_FILE"
        else
          echo "# CONFIG_PACKAGE_luci-app-msd_lite is not set" >> "$CONFIG_FILE"
          echo "# CONFIG_PACKAGE_luci-app-omcproxy is not set" >> "$CONFIG_FILE"
        fi

        # MTK HQoS (luci-app-eqos-mtk + mtkhqos_util)
        if [ "${{ github.event.inputs.MTKHQOS }}" = "true" ]; then
          echo "CONFIG_PACKAGE_luci-app-eqos-mtk=y" >> "$CONFIG_FILE"
          echo "CONFIG_PACKAGE_mtkhqos_util=y" >> "$CONFIG_FILE"
        else
          echo "# CONFIG_PACKAGE_luci-app-eqos-mtk is not set" >> "$CONFIG_FILE"
          echo "# CONFIG_PACKAGE_mtkhqos_util is not set" >> "$CONFIG_FILE"
        fi

        grep -n -E "CONFIG_(MTK_MEMORY_SHRINK_AGGRESS|PACKAGE_kmod-zram|PACKAGE_zram-swap|PACKAGE_luci-app-msd_lite|PACKAGE_luci-app-omcproxy|PACKAGE_luci-app-eqos-mtk|PACKAGE_mtkhqos_util)" "$CONFIG_FILE" || true

    - name: Download package
      id: package
      timeout-minutes: 90
      run: |
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE ImmortalWrt/.config
        cd ImmortalWrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      timeout-minutes: 180
      run: |
        cd ImmortalWrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DEVICE_NAME=_mt7981" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v7
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: ImmortalWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ImmortalWrt/bin

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd ImmortalWrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v7
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ImmortalWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT

        # Kernel version from the cloned source tree: include/kernel-5.4 -> LINUX_KERNEL_HASH-5.4.xxx = <hash>
        KERNEL_VERSION=$(sed -n 's/^LINUX_KERNEL_HASH-\([0-9][0-9.]*\)[[:space:]]*=.*/\1/p' ImmortalWrt/include/kernel-5.4 2>/dev/null | head -n1)
        KERNEL_VERSION="${KERNEL_VERSION:-unknown}"

        # Source commit of the cloned tree (the exact code being built); fall back to the branch link
        SOURCE_COMMIT=$(git -C ImmortalWrt rev-parse --short HEAD 2>/dev/null || true)
        if [ -n "$SOURCE_COMMIT" ]; then
          SOURCE_LINK="$REPO_URL/commit/$SOURCE_COMMIT"
        else
          SOURCE_COMMIT="unknown"
          SOURCE_LINK="$REPO_URL/tree/$REPO_BRANCH"
        fi

        cat > release.txt <<EOF
        ## ImmortalWrt mt7981 360t7 & wr30u Release $(date +"%Y.%m.%d-%H:%M")

        ### 构建信息
        - 源码仓库: $REPO_URL
        - 源码分支: [$REPO_BRANCH]($REPO_URL/tree/$REPO_BRANCH)
        - 源码 Commit: [$SOURCE_COMMIT]($SOURCE_LINK)
        - 配置文件: $CONFIG_FILE
        - 内核版本: $KERNEL_VERSION
        - 管理地址: 192.168.6.1
        - 编译缓存: ${{ github.event.inputs.Cache }}
        - MEMORY_SHRINK_AGGRESS: ${{ github.event.inputs.MEMORY_SHRINK_AGGRESS }}
        - ZRAM_SWAP: ${{ github.event.inputs.ZRAM_SWAP }}
        - IPTV_PACKAGES: ${{ github.event.inputs.IPTV_PACKAGES }}
        - MTKHQOS: ${{ github.event.inputs.MTKHQOS }}

        ### 适配的 BL2 + U-Boot
        - stock/custom partition layout, enable MTK-NMBM：
          1. https://github.com/hanwckf/bl-mt798x
          2. https://github.com/Yuzhii0718/bl-mt798x-dhcpd
             - Variant：default
             - Version：SP1 (or enable _MT7986_TRNG_NS_ACCESS)
        EOF

        echo "status=success" >> $GITHUB_OUTPUT
        mv ImmortalWrt/.config ImmortalWrt/build.config

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      if: steps.tag.outputs.status == 'success' && !cancelled()
      with:
        token: ${{ github.token }}
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: |
          ${{ env.FIRMWARE }}/immortalwrt*.bin
          ImmortalWrt/build.config

    - name: Remove old Releases and Workflows
      uses: ophub/delete-releases-workflows@main
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        delete_releases: true
        releases_keep_latest: 10
        delete_tags: true
        delete_workflows: true
        workflows_keep_day: 10
        gh_token: ${{ github.token }}